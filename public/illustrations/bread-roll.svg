<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none" role="img" aria-label="Artisan bread roll">
  <defs>
    <linearGradient id="bgs-bread-crust" x1="17" y1="18" x2="49" y2="52" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FBE4AE" />
      <stop offset=".42" stop-color="#EFC27F" />
      <stop offset=".8" stop-color="#D9954F" />
      <stop offset="1" stop-color="#B87035" />
    </linearGradient>
    <linearGradient id="bgs-bread-bottom" x1="32" y1="39" x2="32" y2="55" gradientUnits="userSpaceOnUse">
      <stop stop-color="#DEA15E" />
      <stop offset="1" stop-color="#A7622F" />
    </linearGradient>
  </defs>
  <!-- Compact oval bakery roll rather than a crescent-shaped croissant -->
  <path d="M7.5 41.5C8.7 27 18 17.5 31.5 16.5 45.5 15.7 55 26.6 56.6 40.8 57.5 49.2 47.7 53.4 33 53.5 18 53.6 7 50.4 7.5 41.5Z" fill="url(#bgs-bread-crust)" stroke="#946030" stroke-width="2" stroke-linejoin="round" />
  <!-- Slightly browned lower rim adds a baked-bread silhouette -->
  <path d="M8.2 40.8C15 45.3 26.3 46.8 34.2 46.8 44.5 46.8 51.8 44.3 56.6 40.3 57.3 49.1 47.6 53.4 33 53.5 18.2 53.6 7.1 50.2 8.2 40.8Z" fill="url(#bgs-bread-bottom)" opacity=".84" />
  <path d="M10.2 41.9C18 46.4 45.5 48 54.8 41.8" stroke="#F6D297" stroke-width="1.8" stroke-linecap="round" opacity=".78" />
  <!-- Three naturally curved bread scoring cuts -->
  <path d="M18 29.2C21.1 31.7 23.1 34.6 23.3 37.4" stroke="#B77335" stroke-width="4.3" stroke-linecap="round" />
  <path d="M29.9 23.5C33.7 27 36.3 31.7 36.1 35.4" stroke="#B77335" stroke-width="4.7" stroke-linecap="round" />
  <path d="M42.4 26.3C45.9 29.2 47.6 32.3 47.5 35.2" stroke="#B77335" stroke-width="4.2" stroke-linecap="round" />
  <path d="M17.2 28.3C20.1 30.3 22.4 33.5 22.6 36.1 M29.2 22.5C33 25.4 35.6 30 35.4 33.8 M41.6 25.1C44.9 27.4 46.9 30.6 46.8 33.7" stroke="#FFF4D8" stroke-width="2.4" stroke-linecap="round" />
  <!-- Small oven shine -->
  <path d="M13.5 36C14.4 30.1 18.2 25 24.2 22.3" stroke="#FFF4D8" stroke-width="2" stroke-linecap="round" opacity=".58" />
  <path d="M46.5 43.7C49.4 43.1 51.9 42.2 53.3 40.5" stroke="#8F5629" stroke-width="1.25" stroke-linecap="round" opacity=".6" />
</svg>
