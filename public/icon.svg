<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f0f7ee"/>
    </linearGradient>
    <linearGradient id="greenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#15803d"/>
      <stop offset="100%" stop-color="#0f3d24"/>
    </linearGradient>
    <linearGradient id="leafGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#86efac"/>
      <stop offset="100%" stop-color="#22c55e"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#0f3d24" flood-opacity="0.12"/>
    </filter>
  </defs>

  <!-- Cute rounded squircle background badge -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#bgGrad)" stroke="#15803d" stroke-width="2.5" filter="url(#shadow)" />

  <!-- Cute little eco leaf accent sprouting on top-right -->
  <path d="M42 15 C47 11, 52 11, 54 14 C54 17, 51 22, 46 22 C43 22, 41 18, 42 15 Z" fill="url(#leafGrad)" />
  <path d="M43 20 Q47 16 51 14" stroke="#15803d" stroke-width="1.2" stroke-linecap="round" fill="none" />

  <!-- Cute bold 19 number in rich green -->
  <text 
    x="31" 
    y="44" 
    font-family="'Plus Jakarta Sans', 'Inter', 'Segoe UI', -apple-system, sans-serif" 
    font-size="33" 
    font-weight="900" 
    fill="url(#greenGrad)" 
    text-anchor="middle"
    letter-spacing="-1.5"
  >19</text>
</svg>

